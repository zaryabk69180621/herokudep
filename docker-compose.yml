services:
  app:
    build: .
    ports:
    - "3000:3000"
    environment:
    - MONGODB_URI=mongodb://mongodb:27017/todoapp
    depends_on:
    - mongodb
    volumes:
    - ./src:/user/src/app/src
    restart: unless-stopped
  mongodb:
    image: mongo:latest
    ports:
    - "27017:27017"
    volumes:
    - mongodb_data:/data/db
    restart: unless-stopped
volumes:
  mongodb_data: