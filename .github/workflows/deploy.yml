name: Deploy to Heroku

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 2. Install Heroku CLI
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
      
      # 3. Login to Heroku
      - name: Login to Heroku
        run: heroku container:login
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      
      # 4. SET STACK TO CONTAINER (NEW STEP)
      - name: Set stack to container
        run: |
          heroku stack:set container --app ${{ secrets.HEROKU_APP_NAME }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      
      # 5. Build and push Docker image
      - name: Build and push Docker image
        run: |
          heroku container:push web --app ${{ secrets.HEROKU_APP_NAME }}
      
      # 6. Release on Heroku
      - name: Release on Heroku
        run: |
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      
      # 7. Health check (Optional)
      - name: Verify deployment
        run: |
          sleep 10  # Wait for app to start
          curl -f https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/health || echo "Health check failed but deployment completed"
